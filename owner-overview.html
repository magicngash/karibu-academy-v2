<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Karibu Academy — Overview</title>
<script src="/runtime-config.js"></script>
<style>
html,body{margin:0;padding:0;background:#FBF6EC;color:#2B2420;font-family:Georgia,serif}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #E8A33D;outline-offset:2px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #E3D8C5;font-size:.9rem}th{color:#6B5D4C;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}.page{max-width:1180px;margin:0 auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #D8CBB5;padding-bottom:18px;margin-bottom:20px}.eyebrow{font-size:12px;letter-spacing:2px;color:#8A5614;font-weight:700}.h1{margin:6px 0 0;font-size:30px}.muted{color:#6B5D4C;line-height:1.45}.card{background:#FFFBF3;border:1px solid #D8CBB5;border-radius:12px;padding:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.metric{background:#F1E9DA;border-radius:10px;padding:13px}.metric-num{display:block;font-size:25px;font-weight:700}.metric-label{display:block;font-size:12px;color:#6B5D4C;margin-top:4px}.btn{border:0;border-radius:8px;padding:10px 14px;background:#4F6F52;color:white;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:transparent;border:1px solid #BFAF98;color:#4F6F52}.select{padding:10px 12px;border:1px solid #D8CBB5;border-radius:8px;background:#FFFBF3;font-size:15px}.bar{height:12px;background:#E3D8C5;border-radius:99px;overflow:hidden}.good{color:#4F6F52;font-weight:700}.warn{color:#8A5614;font-weight:700}.bad{color:#A33A31;font-weight:700}.notice{background:#F5E2DF;color:#8B2F27;padding:12px;border-radius:8px;margin-bottom:16px}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.scroll{overflow-x:auto}.wide{min-width:720px}@media(max-width:720px){.wide{min-width:720px}}
</style>
</head>
<body>
<main id="app" class="page"></main>
<script>
const SUPABASE_URL=window.KARIBU_SUPABASE_URL||"https://YOUR-V2-PROJECT.supabase.co";
const SUPABASE_ANON_KEY=window.KARIBU_SUPABASE_ANON_KEY||"YOUR_V2_PUBLISHABLE_OR_ANON_KEY";
const TOKEN_KEY="karibu-v2-auth-token";
const restaurantId=new URLSearchParams(location.search).get("restaurant");
const app=document.getElementById("app");
const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const fmt=value=>value==null?"—":Number(value).toLocaleString();
const pct=(value,total)=>total?Math.round(Number(value||0)/Number(total)*100):0;
const rateClass=value=>Number(value)>=80?"good":Number(value)>=60?"warn":"bad";
async function callRpc(name,params){let token=null;try{token=localStorage.getItem(TOKEN_KEY)}catch(_){}try{const response=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:"POST",headers:{"Content-Type":"application/json",apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`},body:JSON.stringify(token?{...params,p_auth_token:token}:params)});const body=await response.json().catch(()=>null);return response.ok?{data:body,error:null}:{data:null,error:body||{message:response.statusText}}}catch(error){return{data:null,error:{message:error.message}}}}
function shell(content){app.innerHTML=`<div class="top"><div><div class="eyebrow">OWNER / TRAINER VIEW · READ ONLY</div><h1 class="h1">Staff progress overview</h1><p class="muted">Restaurant-wide training usage and assessment performance.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><select id="range" class="select"><option value="all">All time</option><option value="30">Last 30 days</option><option value="month">This month</option></select><button id="refresh" class="btn secondary">Refresh</button><a class="btn secondary" href="owner-staff-progress.html?restaurant=${encodeURIComponent(restaurantId||"")}">Staff progress</a><button id="back" class="btn">Back</button></div></div>${content}`;document.getElementById("back").onclick=()=>history.back();document.getElementById("refresh").onclick=()=>load(document.getElementById("range").value)}
function render(data,range){const m=data.metrics||{},modules=data.modules||[],mcq=data.mcq_questions||[],attention=data.attention||[],recent=data.recent||[];const completion=pct(m.modules_completed,m.modules_possible),passRate=pct(m.passed_attempts,(m.passed_attempts||0)+(m.failed_attempts||0)),firstPass=pct(m.first_passed,m.first_scored);const metrics=[["Staff",fmt(m.staff_total),`${fmt(m.staff_started)} started`],["Modules completed",`${fmt(m.modules_completed)} / ${fmt(m.modules_possible)}`,`${completion}% overall`],["Attempts",fmt(m.attempts_total),`${fmt(m.scored_attempts)} scored`],["Pass rate",`${passRate}%`,`${fmt(m.passed_attempts)} passed · ${fmt(m.failed_attempts)} failed`],["Average score",m.average_score==null?"—":`${m.average_score}%`,"latest scored attempt per staff/module"],["Awaiting marking",fmt(m.awaiting_marking),"needs attention"]];const moduleRows=modules.map(row=>{const completionRate=pct(row.completed_staff,row.staff_count),pass=pct(row.passed,row.passed+row.failed);return `<tr><td><strong>Module ${row.module_id}</strong></td><td>${row.completed_staff}/${row.staff_count}</td><td class="${rateClass(completionRate)}">${completionRate}%</td><td>${fmt(row.attempts)}</td><td class="${rateClass(pass)}">${row.passed+row.failed?pass+"%":"—"}</td><td>${row.average_mcq==null?"—":row.average_mcq+"%"}</td><td>${row.average_score==null?"—":row.average_score+"%"}</td></tr>`}).join("");const questionRows=mcq.slice().sort((a,b)=>(a.correct_rate||0)-(b.correct_rate||0)).slice(0,8).map(row=>`<tr><td>Module ${row.module_id} · Q${row.question_index+1}</td><td>${row.answered}</td><td>${row.correct}</td><td class="${rateClass(row.correct_rate)}">${row.correct_rate}%</td></tr>`).join("");const attentionHtml=attention.length?attention.map(row=>`<p class="muted"><strong>${row.value}</strong> · ${esc(row.label)}</p>`).join(""):"<p class=\"muted\">No immediate attention items.</p>";const recentHtml=recent.length?recent.map(row=>`<p class="muted">${new Date(row.happened_at).toLocaleString()} · ${esc(row.full_name)} · Module ${row.module_id} · ${esc(row.status)}${row.overall_percent!=null?` · ${row.overall_percent}%`:""}</p>`).join(""):"<p class=\"muted\">No recent assessment activity.</p>";shell(`<div class="grid">${metrics.map(([label,value,sub])=>`<div class="metric"><span class="metric-num">${value}</span><span class="metric-label">${label}</span><small class="muted">${sub}</small></div>`).join("")}</div><div class="two" style="margin-top:16px"><section class="card"><h2>Completion</h2><p class="muted">${fmt(m.modules_completed)} of ${fmt(m.modules_possible)} module assignments complete</p><div class="bar"><div style="height:100%;width:${completion}%;background:#4F6F52"></div></div><p class="muted">${fmt(m.staff_started)} of ${fmt(m.staff_total)} staff have started training.</p></section><section class="card"><h2>Assessment outcomes</h2><p class="muted">${fmt(m.passed_attempts)} passed · ${fmt(m.failed_attempts)} failed · ${fmt(m.awaiting_marking)} awaiting marking</p><div class="bar"><div style="height:100%;width:${passRate}%;background:#4F6F52"></div></div><p class="muted">First-attempt pass rate: ${firstPass}% · All scored attempts: ${passRate}%</p></section></div><section class="card"><h2>Module performance</h2><div class="scroll"><table class="wide"><thead><tr><th>Module</th><th>Completed</th><th>Completion</th><th>Attempts</th><th>Pass rate</th><th>Avg MCQ</th><th>Avg overall</th></tr></thead><tbody>${moduleRows}</tbody></table></div></section><div class="two"><section class="card"><h2>MCQ summary</h2><p class="muted">${m.average_mcq==null?"No scored MCQ data yet.":`Average MCQ score: ${m.average_mcq}%`}</p>${questionRows?`<div class="scroll"><table class="wide"><thead><tr><th>Question</th><th>Answered</th><th>Correct</th><th>Correct rate</th></tr></thead><tbody>${questionRows}</tbody></table></div>`:"<p class=\"muted\">Question-level data will appear after answers are submitted.</p>"}</section><section class="card"><h2>Needs attention</h2>${attentionHtml}</section></div><section class="card"><h2>Recent activity</h2>${recentHtml}</section>`);document.getElementById("range").value=range}
async function load(range="all"){shell("<p class=\"muted\">Loading overview…</p>");if(!restaurantId){app.insertAdjacentHTML("beforeend","<div class=\"notice\">No restaurant was selected.</div>");return}const since=range==="30"?new Date(Date.now()-30*86400000).toISOString():range==="month"?new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString():null;const result=await callRpc("owner_overview",{p_restaurant_id:restaurantId,p_since:since});if(result.error||result.data?.error){app.insertAdjacentHTML("beforeend",`<div class="notice">${esc(result.error?.message||result.data?.error||"Could not load overview.")}</div>`);return}render(result.data,range)}
load();
</script>
</body>
</html>
